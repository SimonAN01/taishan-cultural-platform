server {
    listen 443 ssl;
    server_name 118.89.176.236;
    ssl_certificate /etc/letsencrypt/live/taishan-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taishan-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 9m;
    client_body_timeout 20s;
    limit_req_status 429;
    gzip on;
    gzip_vary on;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml;
    location /api/ {
        limit_req zone=taishan_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:18600;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 70s;
    }
    location / {
        proxy_pass http://127.0.0.1:18600;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
