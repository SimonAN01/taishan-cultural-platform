limit_req_zone $binary_remote_addr zone=taishan_api:1m rate=10r/s;
server {
    listen 80;
    listen 8037;
    server_name _;
    # Include multipart overhead; the API enforces the exact 8 MB image limit.
    client_max_body_size 9m;
    client_body_timeout 20s;
    limit_req_status 429;
    gzip on;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml;
    location /api/ {
        limit_req zone=taishan_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:18600;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 70s;
    }
    # Only the Word interface remains public. Retire legacy page bundles.
    location = / {
        add_header Cache-Control "no-store" always;
        return 302 /experience/$is_args$args;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
        return 302 /experience/$is_args$args;
    }
    location = /classic {
        return 302 /experience/$is_args$args;
    }
    location ^~ /classic/ {
        return 302 /experience/$is_args$args;
    }
    location ~ ^/(app\.js|map\.js|ui\.js|assistant\.js|style\.css)$ {
        add_header Cache-Control "no-store" always;
        return 410;
    }
    location / {
        proxy_pass http://127.0.0.1:18600;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
